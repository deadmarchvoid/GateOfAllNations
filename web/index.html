<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GateOfAllNations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .header {
      padding: 20px 30px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .container {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .status-card {
      padding: 25px;
      border-radius: 14px;
      background: #1e293b;
      border: 1px solid #334155;
    }

    .status-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #14532d;
      color: #bbf7d0;
      font-size: 14px;
      font-weight: bold;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      padding: 22px;
      border-radius: 14px;
      background: #1e293b;
      border: 1px solid #334155;
    }

    .card-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>GateOfAllNations</h1>
    <p>Control Panel</p>
  </header>

  <main class="container">

    <section class="status-card">
      <div class="status-title">System Status</div>

      <div class="online">
        <span class="dot"></span>
        Online
      </div>
    </section>

    <section class="cards">

      <div class="card">
        <div class="card-title">Application</div>
        <div class="card-value">GateOfAllNations</div>
      </div>

      <div class="card">
        <div class="card-title">Environment</div>
        <div class="card-value">Production</div>
      </div>

      <div class="card">
        <div class="card-title">Platform</div>
        <div class="card-value">Node.js</div>
      </div>

      <div class="card">
        <div class="card-title">Status</div>
        <div class="card-value">Running</div>
      </div>

    </section>

  </main>

</body>
</html>
